<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 54" width="240" height="54" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBC76"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9E7632"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>
  
  <!-- Pointed Arch Icon Centered -->
  <g transform="translate(120, 13)">
    <path d="M-11 11V4.5C-11 0 -4.5 -4.5 0 -8.5C4.5 -4.5 11 0 11 4.5V11" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="0" cy="-11.5" r="1" fill="url(#goldGrad)"/>
  </g>
  
  <!-- Brand Name Typography -->
  <text x="120" y="42" text-anchor="middle" fill="url(#goldGrad)" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="500" letter-spacing="1.2">Dar Al Haya</text>
</svg>